spring:
  application:
    name: jewelry-store-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI / Swagger 3
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 900000 # 15 phút (15 * 60 * 1000)
  refresh-token-expiration-ms: 604800000 # 7 ngày (7 * 24 * 60 * 60 * 1000)

# Payment Gateways Configuration
payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOTMN1}
    hash-secret: ${VNPAY_HASH_SECRET:RAOCTP02OZ8FKKAEBRISAAWUM8SO1KEJ}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  vietqr:
    bank-id: ${VIETQR_BANK_ID:MB}
    account-no: ${VIETQR_ACCOUNT_NO:0987654321}
    account-name: ${VIETQR_ACCOUNT_NAME:AURA FINE JEWELRY}

# File Upload Configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}



