spring:
  application:
    name: jewelry-store-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI / Swagger 3
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
